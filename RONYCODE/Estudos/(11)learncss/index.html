
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Clone Challenge</title>
    
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis da Identidade Visual */
        :root {
            --bg-gradient-start: #eef2f8;
            --bg-gradient-end: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary-blue: #1d4ed8;
            --primary-blue-hover: #1e3a8a;
            --secondary-blue: #eff6ff;
            --border-color: #e2e8f0;
            --info-bg: #f8fafc;
            --success: #10b981;
            --code-bg: #1e293b; 
            --code-text: #f8fafc;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --font-family: 'Inter', sans-serif;
            --font-mono: 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1200px; width: 100%; }

        .header {
            margin-bottom: 2rem;
            max-width: 800px;
        }

        .eyebrow {
            color: var(--primary-blue);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            gap: 1.5rem;
            align-items: start;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .section-label {
            color: var(--primary-blue);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Paleta de Cores */
        .color-palette {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--info-bg);
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            background: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .color-item:hover { transform: scale(1.05); }

        .color-swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Editor de Código Visual */
        .editor-wrapper {
            background-color: var(--code-bg);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .code-syntax {
            color: #94a3b8;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            margin: 0.25rem 0;
        }
        .code-syntax span { color: #38bdf8; }

        .code-textarea {
            width: 100%;
            height: 200px;
            padding: 0.5rem 0.5rem 0.5rem 2rem;
            background-color: transparent;
            color: var(--code-text);
            border: none;
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
        }
        .code-textarea:focus { outline: none; }

        /* Arenas de Batalha (Target vs Player) */
        .battle-arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            height: 400px;
        }

        .stage {
            background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 10px, #ffffff 10px, #ffffff 20px);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stage-label {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255,255,255,0.9);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        /* Elementos a serem estilizados */
        #target-shape {
            display: block;
        }

        #player-shape {
            /* Estilos injetados via texto do usuário */
            width: 0; height: 0; background: transparent;
        }

        /* Overlay de Sucesso */
        .success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(16, 185, 129, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .success-overlay h2 { font-size: 2.5rem; margin-bottom: 1rem; }

        .btn-next {
            background: white;
            color: var(--success);
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .btn-next:hover { transform: scale(1.05); }

        /* Toast de Cópia */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-dark);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .battle-arena { grid-template-columns: 1fr; height: auto; gap: 1rem; }
            .stage { height: 300px; }
        }
    </style>

    <!-- Onde o CSS do alvo é gerado -->
    <style id="target-styles"></style>
    <!-- Onde o CSS do jogador é gerado -->
    <style id="player-styles"></style>

</head>
<body>

    <div id="toast">Cor copiada!</div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <span class="eyebrow">Desafio de Replicação</span>
            <h1 class="title">CSS Clone</h1>
            <p class="subtitle">Seu objetivo é reproduzir o alvo da esquerda exatamente igual no quadro da direita. Quando o tamanho, cor e bordas combinarem 100%, você avança!</p>
        </header>

        <main class="main-layout">
            
            <!-- Controles (Esquerda) -->
            <aside class="card">
                <span class="section-label" id="levelDisplay">Nível 1 de 5</span>
                <h2 class="section-title">Paleta da Fase</h2>

                <!-- Cores permitidas na fase -->
                <div class="color-palette" id="colorPalette">
                    <!-- Gerado pelo JS -->
                </div>

                <span class="section-label">Seu Código CSS</span>
                
                <div class="editor-wrapper">
                    <div class="code-syntax"><span>#shape</span> {</div>
                    <textarea id="cssInput" class="code-textarea" spellcheck="false" placeholder="width: 100px;"></textarea>
                    <div class="code-syntax">}</div>
                </div>

            </aside>

            <!-- Área Visual (Direita) -->
            <section class="card" style="padding: 1rem;">
                
                <div class="battle-arena">
                    <!-- Palco do Alvo -->
                    <div class="stage">
                        <div class="stage-label">🎯 Alvo</div>
                        <div id="target-shape"></div>
                    </div>

                    <!-- Palco do Jogador -->
                    <div class="stage">
                        <div class="stage-label">✨ Seu Desenho</div>
                        <div id="player-shape"></div>
                    </div>
                </div>

                <!-- Tela de Vitória -->
                <div class="success-overlay" id="successScreen">
                    <h2>100% Igual! 🎉</h2>
                    <button class="btn-next" onclick="nextLevel()">Próxima Fase ➔</button>
                </div>

            </section>
        </main>
    </div>

    <script>
        // Configuração das fases
        const levels = [
            {
                // Nível 1: Quadrado Básico
                colors: ["#3b82f6"],
                css: "width: 150px;\nheight: 150px;\nbackground-color: #3b82f6;",
                startCode: "/* Desenhe um quadrado de 150px com a cor acima */\n"
            },
            {
                // Nível 2: Círculo
                colors: ["#ef4444"],
                css: "width: 160px;\nheight: 160px;\nbackground-color: #ef4444;\nborder-radius: 50%;",
                startCode: "/* Faça um círculo de 160px. Dica: use border-radius */\n"
            },
            {
                // Nível 3: Pílula (Pill)
                colors: ["#10b981"],
                css: "width: 250px;\nheight: 80px;\nbackground-color: #10b981;\nborder-radius: 40px;",
                startCode: "/* Largura 250px, Altura 80px. Deixe as pontas redondas */\n"
            },
            {
                // Nível 4: A Folha (Arredondamento específico)
                colors: ["#8b5cf6"],
                css: "width: 150px;\nheight: 150px;\nbackground-color: #8b5cf6;\nborder-radius: 100px 0px 100px 0px;",
                startCode: "/* Um quadrado de 150px, mas apenas duas pontas são redondas (100px) */\n"
            },
            {
                // Nível 5: O Arco (Lápide)
                colors: ["#f59e0b"],
                css: "width: 150px;\nheight: 200px;\nbackground-color: #f59e0b;\nborder-radius: 75px 75px 0px 0px;",
                startCode: "/* Largura 150px, Altura 200px. Apenas o topo é redondo! */\n"
            }
        ];

        let currentLevelIndex = 0;
        
        const cssInput = document.getElementById('cssInput');
        const targetStyles = document.getElementById('target-styles');
        const playerStyles = document.getElementById('player-styles');
        const colorPalette = document.getElementById('colorPalette');
        const levelDisplay = document.getElementById('levelDisplay');
        const successScreen = document.getElementById('successScreen');
        const toast = document.getElementById('toast');

        const targetShape = document.getElementById('target-shape');
        const playerShape = document.getElementById('player-shape');

        // Propriedades CSS que o "Juiz" vai verificar para dar 100%
        const propertiesToCheck = [
            'width', 'height', 'backgroundColor', 
            'borderTopLeftRadius', 'borderTopRightRadius', 
            'borderBottomRightRadius', 'borderBottomLeftRadius'
        ];

        function loadLevel() {
            const level = levels[currentLevelIndex];
            levelDisplay.innerText = `Fase ${currentLevelIndex + 1} de ${levels.length}`;
            
            // Injeta o CSS perfeito no Alvo
            targetStyles.innerHTML = `#target-shape { ${level.css} }`;
            
            // Renderiza as cores clicáveis
            colorPalette.innerHTML = '';
            level.colors.forEach(color => {
                const item = document.createElement('div');
                item.className = 'color-item';
                item.innerHTML = `<div class="color-swatch" style="background-color: ${color};"></div> ${color}`;
                item.onclick = () => copyToClipboard(color);
                colorPalette.appendChild(item);
            });

            // Reseta o jogador
            cssInput.value = level.startCode;
            playerStyles.innerHTML = `#player-shape { }`;
            successScreen.classList.remove('active');
        }

        // Evento principal: Enquanto digita, atualiza e verifica
        cssInput.addEventListener('input', () => {
            const userCode = cssInput.value;
            playerStyles.innerHTML = `#player-shape { ${userCode} }`;
            checkWinCondition();
        });

        // O "Juiz"
        function checkWinCondition() {
            // Pega os estilos calculados (reais) processados pelo navegador
            const targetComputed = window.getComputedStyle(targetShape);
            const playerComputed = window.getComputedStyle(playerShape);

            let isPerfectMatch = true;

            // Verifica se TODAS as propriedades obrigatórias estão idênticas
            for (let prop of propertiesToCheck) {
                // Remove espaços em branco do RGB e padroniza as strings para evitar falsos negativos
                const targetValue = targetComputed[prop].replace(/\s/g, '');
                const playerValue = playerComputed[prop].replace(/\s/g, '');

                if (targetValue !== playerValue) {
                    isPerfectMatch = false;
                    break;
                }
            }

            // A largura tem que ser maior que 0 pra evitar que a tela branca vazia conte como vitória
            if (isPerfectMatch && parseFloat(playerComputed.width) > 0) {
                successScreen.classList.add('active');
            }
        }

        function nextLevel() {
            currentLevelIndex++;
            if (currentLevelIndex >= levels.length) {
                alert("Você zerou o jogo! Parabéns, mestre do CSS!");
                currentLevelIndex = 0; // Reseta
            }
            loadLevel();
        }

        // Utilidade de UX: Copiar a cor e suportar TAB
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            toast.style.opacity = 1;
            setTimeout(() => toast.style.opacity = 0, 2000);
        }

        cssInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                playerStyles.innerHTML = `#player-shape { ${this.value} }`;
                checkWinCondition();
            }
        });

        // Inicia o jogo
        window.onload = loadLevel;

    </script>
</body>
</html>
