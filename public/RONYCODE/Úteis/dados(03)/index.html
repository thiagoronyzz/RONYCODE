<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançador de Dados 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        :root {
            --bg-color: #f4f7fb;
            --text-main: #1e293b;
            --text-light: #64748b;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --dice-color: #1e3a8a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1200px; width: 100%; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-text h3 {
            color: var(--accent-blue);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .header-text h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        .info-box {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            min-width: 240px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .card-header {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--accent-blue); }

        .presets {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn-preset {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-preset:hover { background: #e2e8f0; color: var(--accent-blue); }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.1rem;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover { background-color: var(--accent-blue-hover); transform: translateY(-2px); }
        .btn-primary:disabled { background-color: var(--text-light); cursor: not-allowed; transform: none; }

        /* --- ÁREA DO DADO --- */
        .dice-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            background: radial-gradient(circle, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 12px;
            border: 1px inset var(--border-color);
            position: relative;
            overflow: hidden;
            perspective: 1000px; /* Cria o campo de profundidade 3D */
        }

        .dice-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        /* O Corpo do Dado */
        .dice {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #3b82f6, #1e3a8a);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            box-shadow: 
                inset 5px 5px 15px rgba(255,255,255,0.4),
                inset -5px -5px 15px rgba(0,0,0,0.4),
                0 10px 20px rgba(0,0,0,0.2);
            position: absolute;
            backface-visibility: hidden;
            border: 2px solid #60a5fa;
            transform-style: preserve-3d;
        }

        /* A Sombra do Dado (reage à altura) */
        .dice-shadow {
            position: absolute;
            width: 90px;
            height: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 50%;
            bottom: -40px;
            left: 15px;
            filter: blur(8px);
            transition: all 0.1s;
        }

        /* --- ANIMAÇÕES --- */
        .rolling .dice-wrapper {
            animation: throw 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .rolling .dice-shadow {
            animation: shadowScale 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes throw {
            0% { transform: translateY(0) rotateX(0) rotateY(0) rotateZ(0); }
            40% { transform: translateY(-180px) rotateX(720deg) rotateY(360deg) rotateZ(180deg); }
            80% { transform: translateY(20px) rotateX(1080deg) rotateY(720deg) rotateZ(360deg); }
            90% { transform: translateY(-20px) rotateX(1100deg) rotateY(750deg) rotateZ(380deg); }
            100% { transform: translateY(0) rotateX(1080deg) rotateY(720deg) rotateZ(360deg); }
        }

        @keyframes shadowScale {
            0% { transform: scale(1); opacity: 0.4; }
            40% { transform: scale(0.3); opacity: 0.1; }
            80% { transform: scale(1.1); opacity: 0.5; }
            90% { transform: scale(0.9); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.4; }
        }

        /* Destaque Final */
        .result-highlight {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #fbbf24; /* Dourado */
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            border-color: #fbbf24;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Histórico */
        .history-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            background: #f8fafc;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .history-roll { font-size: 1.2rem; color: var(--accent-blue); font-weight: 800; }
        .history-type { font-size: 0.8rem; color: var(--text-light); }

        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .dice-arena { min-height: 300px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="header-text">
            <h3>Ferramenta de Simulação</h3>
            <h1>Lançador de Dados 3D</h1>
            <p>Escolha o número de lados. A matemática garante 100% de precisão e chances iguais para todas as faces.</p>
        </div>
        <div class="info-box">
            <h4>Total de Lançamentos</h4>
            <p><span id="total-rolls" style="font-size: 1.5rem; font-weight: 800; color: var(--accent-blue);">0</span></p>
        </div>
    </header>

    <div class="main-content">
        <aside class="card">
            <div class="card-header">Configuração</div>
            <h2 class="card-title">Opções do Dado</h2>
            
            <div class="form-group">
                <label>Atalhos rápidos (Faces)</label>
                <div class="presets">
                    <button class="btn-preset" onclick="setSides(4)">d4</button>
                    <button class="btn-preset" onclick="setSides(6)">d6</button>
                    <button class="btn-preset" onclick="setSides(8)">d8</button>
                    <button class="btn-preset" onclick="setSides(10)">d10</button>
                    <button class="btn-preset" onclick="setSides(12)">d12</button>
                    <button class="btn-preset" onclick="setSides(20)">d20</button>
                    <button class="btn-preset" onclick="setSides(100)">d100</button>
                </div>
            </div>

            <div class="form-group">
                <label>Número de lados personalizado</label>
                <input type="number" id="sides-input" value="6" min="2" max="9999">
            </div>

            <button class="btn-primary" id="btn-roll">Lançar Dado</button>

            <div class="history-list" id="history-container">
                <!-- Histórico entra aqui -->
            </div>
        </aside>

        <main class="card" style="display: flex; flex-direction: column;">
            <div class="card-header">Visualização</div>
            <div class="dice-arena" id="arena">
                <div class="dice-wrapper" id="dice-wrapper">
                    <div class="dice-shadow"></div>
                    <div class="dice" id="dice-face">6</div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    const sidesInput = document.getElementById('sides-input');
    const btnRoll = document.getElementById('btn-roll');
    const arena = document.getElementById('arena');
    const diceWrapper = document.getElementById('dice-wrapper');
    const diceFace = document.getElementById('dice-face');
    const historyContainer = document.getElementById('history-container');
    const totalRollsDisplay = document.getElementById('total-rolls');

    let isRolling = false;
    let rollCount = 0;
    let history = [];

    // Função de clique nos atalhos
    function setSides(num) {
        sidesInput.value = num;
    }

    function rollDice() {
        if (isRolling) return;

        let sides = parseInt(sidesInput.value);
        
        // Validação
        if (isNaN(sides) || sides < 2) {
            sides = 6;
            sidesInput.value = 6;
        }

        isRolling = true;
        btnRoll.disabled = true;
        btnRoll.textContent = "Lançando...";
        diceFace.classList.remove('result-highlight');

        // Adiciona classe que dispara a animação CSS (pulo e giro 3D)
        arena.classList.add('rolling');

        // Durante a animação, mostra números aleatórios para dar efeito visual
        let flickerInterval = setInterval(() => {
            diceFace.textContent = Math.floor(Math.random() * sides) + 1;
        }, 80);

        // Termina a animação exatamente após o tempo do CSS (1.2s = 1200ms)
        setTimeout(() => {
            clearInterval(flickerInterval);
            arena.classList.remove('rolling');

            // CÁLCULO REAL E JUSTO:
            const finalResult = Math.floor(Math.random() * sides) + 1;
            
            diceFace.textContent = finalResult;
            diceFace.classList.add('result-highlight'); // Brilho no resultado

            saveHistory(finalResult, sides);
            
            isRolling = false;
            btnRoll.disabled = false;
            btnRoll.textContent = "Lançar Dado";
        }, 1200);
    }

    function saveHistory(result, sides) {
        rollCount++;
        totalRollsDisplay.textContent = rollCount;

        history.unshift({ result, sides });
        if (history.length > 5) history.pop(); // Mantém apenas os 5 últimos

        updateHistoryUI();
    }

    function updateHistoryUI() {
        historyContainer.innerHTML = "";
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <span class="history-type">Dado de ${item.sides} lados</span>
                <span class="history-roll">${item.result}</span>
            `;
            historyContainer.appendChild(div);
        });
    }

    btnRoll.addEventListener('click', rollDice);

    // Permitir lançar apertando Enter no input
    sidesInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') rollDice();
    });
</script>

</body>
</html>
