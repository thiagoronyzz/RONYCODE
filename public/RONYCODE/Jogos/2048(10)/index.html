<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#faf8ef">
    <title>2048 Clássico</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --page: #faf8ef;
            --ink: #776e65;
            --board: #bbada0;
            --slot: rgba(238, 228, 218, 0.35);
            --gap: clamp(8px, 2.2vw, 14px);
            --radius: 7px;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 16% 10%, rgba(237, 194, 46, 0.12), transparent 24rem),
                var(--page);
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        button { font: inherit; }

        .app {
            width: min(100%, 500px);
            animation: enter 520ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 18px;
        }

        .brand {
            margin: 0;
            font-size: clamp(4rem, 18vw, 6.4rem);
            line-height: .8;
            letter-spacing: -0.09em;
            font-weight: 900;
            color: var(--ink);
        }

        .score-area {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .score-box {
            min-width: 88px;
            padding: 8px 12px 7px;
            border-radius: 5px;
            background: #bbada0;
            color: #fff;
            text-align: center;
        }

        .score-label {
            display: block;
            color: #eee4da;
            font-size: .7rem;
            line-height: 1;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            margin-top: 4px;
            font-size: 1.45rem;
            line-height: 1;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .score-value.bump { animation: scoreBump 260ms ease; }

        .intro {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            margin-bottom: 18px;
        }

        .intro p {
            margin: 0;
            max-width: 300px;
            font-size: 1rem;
            line-height: 1.35;
        }

        .intro strong { color: #5f574f; }

        .new-game,
        .overlay-button {
            border: 0;
            border-radius: 5px;
            background: #8f7a66;
            color: #f9f6f2;
            min-height: 46px;
            padding: 0 20px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 0 #6f5e4e;
            transform: translateY(0);
            transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
        }

        .new-game:hover,
        .overlay-button:hover {
            background: #9d856e;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #6f5e4e;
        }

        .new-game:active,
        .overlay-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #6f5e4e;
        }

        .new-game:focus-visible,
        .overlay-button:focus-visible {
            outline: 4px solid rgba(237, 194, 46, .55);
            outline-offset: 3px;
        }

        .board-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius);
            background: var(--board);
            padding: var(--gap);
            box-shadow: 0 14px 34px rgba(119, 110, 101, .18);
            touch-action: none;
            user-select: none;
        }

        .board-wrap.shake { animation: noMove 180ms ease; }

        .grid,
        .tiles {
            position: absolute;
            inset: var(--gap);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: var(--gap);
        }

        .slot {
            border-radius: var(--radius);
            background: var(--slot);
        }

        .tile {
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            font-size: clamp(1.7rem, 9vw, 3.3rem);
            font-weight: 900;
            letter-spacing: -.055em;
            color: #776e65;
            line-height: 1;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .26);
        }

        .tile.spawn { animation: spawn 190ms cubic-bezier(.2, .8, .3, 1.2) both; }
        .tile.merged { animation: merge 260ms cubic-bezier(.2, .9, .3, 1.15) both; z-index: 2; }

        .v2 { background: #eee4da; }
        .v4 { background: #ede0c8; }
        .v8 { background: #f2b179; color: #f9f6f2; }
        .v16 { background: #f59563; color: #f9f6f2; }
        .v32 { background: #f67c5f; color: #f9f6f2; }
        .v64 { background: #f65e3b; color: #f9f6f2; }
        .v128 { background: #edcf72; color: #f9f6f2; font-size: clamp(1.45rem, 7.3vw, 2.65rem); }
        .v256 { background: #edcc61; color: #f9f6f2; font-size: clamp(1.45rem, 7.3vw, 2.65rem); }
        .v512 { background: #edc850; color: #f9f6f2; font-size: clamp(1.45rem, 7.3vw, 2.65rem); }
        .v1024 { background: #edc53f; color: #f9f6f2; font-size: clamp(1.15rem, 6vw, 2.15rem); }
        .v2048 {
            background: #edc22e;
            color: #f9f6f2;
            font-size: clamp(1.15rem, 6vw, 2.15rem);
            box-shadow: 0 0 24px rgba(237, 194, 46, .6), inset 0 1px 0 rgba(255, 255, 255, .3);
        }
        .vlarge { background: #3c3a32; color: #f9f6f2; font-size: clamp(.95rem, 5vw, 1.8rem); }

        .game-message {
            position: absolute;
            inset: 0;
            z-index: 10;
            border-radius: var(--radius);
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 22px;
            background: rgba(238, 228, 218, .82);
            backdrop-filter: blur(3px);
            opacity: 1;
            visibility: visible;
            transition: opacity 220ms ease, visibility 220ms ease;
        }

        .game-message.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .game-message h2 {
            margin: 0;
            color: #776e65;
            font-size: clamp(2.4rem, 11vw, 4.5rem);
            line-height: .95;
            text-align: center;
            letter-spacing: -.05em;
        }

        .message-actions { display: flex; gap: 12px; }

        .overlay-button.secondary {
            background: #edc22e;
            box-shadow: 0 4px 0 #c79e13;
        }

        .how-to {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #d8cec4;
            color: #776e65;
            font-size: .95rem;
            line-height: 1.55;
        }

        .how-to p { margin: 0; }

        .keys {
            display: inline-flex;
            gap: 4px;
            vertical-align: middle;
            margin: 0 4px;
        }

        kbd {
            display: inline-grid;
            min-width: 25px;
            height: 25px;
            place-items: center;
            border: 1px solid #c9bdb1;
            border-bottom-width: 3px;
            border-radius: 4px;
            background: #fff;
            color: #776e65;
            font: 800 .75rem Arial, sans-serif;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spawn {
            from { opacity: 0; transform: scale(.35); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes merge {
            0% { transform: scale(1); }
            55% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        @keyframes scoreBump {
            50% { transform: scale(1.2); color: #fff7c2; }
        }

        @keyframes noMove {
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        @media (max-width: 520px) {
            body { place-items: start center; padding-top: 24px; }
            .topbar { align-items: center; }
            .score-box { min-width: 70px; padding-inline: 8px; }
            .intro { align-items: flex-start; }
            .intro p { font-size: .9rem; }
            .new-game { min-height: 42px; padding-inline: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="app" aria-labelledby="gameTitle">
        <header class="topbar">
            <h1 class="brand" id="gameTitle">2048</h1>
            <div class="score-area" aria-label="Placar">
                <div class="score-box">
                    <span class="score-label">Pontos</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">Recorde</span>
                    <span class="score-value" id="best">0</span>
                </div>
            </div>
        </header>

        <section class="intro" aria-label="Instruções rápidas">
            <p>Junte os números e chegue ao bloco <strong>2048!</strong></p>
            <button class="new-game" id="newGameButton" type="button">Novo jogo</button>
        </section>

        <section class="board-wrap" id="board" aria-label="Tabuleiro do jogo 2048">
            <div class="grid" aria-hidden="true">
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
                <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
            </div>
            <div class="tiles" id="tiles"></div>
            <div class="game-message hidden" id="message" aria-live="assertive">
                <h2 id="messageTitle">Fim de jogo!</h2>
                <div class="message-actions">
                    <button class="overlay-button secondary" id="continueButton" type="button">Continuar</button>
                    <button class="overlay-button" id="retryButton" type="button">Tentar de novo</button>
                </div>
            </div>
        </section>

        <section class="how-to">
            <p><strong>Como jogar:</strong> use as <span class="keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span> ou WASD. No celular, deslize sobre o tabuleiro. Blocos iguais se unem quando se encontram.</p>
        </section>

        <p class="sr-only" id="announcement" aria-live="polite"></p>
    </main>

    <script>
        const SIZE = 4;
        const tilesElement = document.getElementById('tiles');
        const boardElement = document.getElementById('board');
        const scoreElement = document.getElementById('score');
        const bestElement = document.getElementById('best');
        const messageElement = document.getElementById('message');
        const messageTitle = document.getElementById('messageTitle');
        const continueButton = document.getElementById('continueButton');
        const retryButton = document.getElementById('retryButton');
        const newGameButton = document.getElementById('newGameButton');
        const announcement = document.getElementById('announcement');

        let board = [];
        let score = 0;
        let best = loadBestScore();
        let won = false;
        let keepPlaying = false;
        let ended = false;
        let touchStart = null;

        function loadBestScore() {
            try {
                return Number(localStorage.getItem('classic-2048-best')) || 0;
            } catch (error) {
                return 0;
            }
        }

        function saveBestScore() {
            try {
                localStorage.setItem('classic-2048-best', String(best));
            } catch (error) {
                // O jogo continua funcionando quando o armazenamento está bloqueado.
            }
        }

        function emptyBoard() {
            return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        }

        function addRandomTile() {
            const empty = [];
            for (let row = 0; row < SIZE; row++) {
                for (let col = 0; col < SIZE; col++) {
                    if (board[row][col] === 0) empty.push({ row, col });
                }
            }

            if (!empty.length) return null;
            const position = empty[Math.floor(Math.random() * empty.length)];
            board[position.row][position.col] = Math.random() < 0.9 ? 2 : 4;
            return position;
        }

        function startGame() {
            board = emptyBoard();
            score = 0;
            won = false;
            keepPlaying = false;
            ended = false;
            hideMessage();

            const first = addRandomTile();
            const second = addRandomTile();
            render([first, second], []);
            updateScores(false);
            announcement.textContent = 'Novo jogo iniciado.';
        }

        function positionFor(direction, lineIndex, cellIndex) {
            if (direction === 'left') return { row: lineIndex, col: cellIndex };
            if (direction === 'right') return { row: lineIndex, col: SIZE - 1 - cellIndex };
            if (direction === 'up') return { row: cellIndex, col: lineIndex };
            return { row: SIZE - 1 - cellIndex, col: lineIndex };
        }

        function getLine(direction, index) {
            if (direction === 'left') return [...board[index]];
            if (direction === 'right') return [...board[index]].reverse();

            const column = board.map(row => row[index]);
            return direction === 'up' ? column : column.reverse();
        }

        function setLine(direction, index, line) {
            for (let cell = 0; cell < SIZE; cell++) {
                const position = positionFor(direction, index, cell);
                board[position.row][position.col] = line[cell];
            }
        }

        function collapseLine(line) {
            const values = line.filter(Boolean);
            const result = [];
            const mergedIndexes = [];
            let gained = 0;

            for (let index = 0; index < values.length; index++) {
                if (values[index] === values[index + 1]) {
                    const mergedValue = values[index] * 2;
                    result.push(mergedValue);
                    mergedIndexes.push(result.length - 1);
                    gained += mergedValue;
                    index++;
                } else {
                    result.push(values[index]);
                }
            }

            while (result.length < SIZE) result.push(0);
            return { line: result, mergedIndexes, gained };
        }

        function boardsMatch(a, b) {
            return a.every((row, rowIndex) =>
                row.every((value, colIndex) => value === b[rowIndex][colIndex])
            );
        }

        function move(direction) {
            if (ended || (won && !keepPlaying)) return;

            const before = board.map(row => [...row]);
            const merged = [];
            let gainedThisMove = 0;

            for (let index = 0; index < SIZE; index++) {
                const collapsed = collapseLine(getLine(direction, index));
                setLine(direction, index, collapsed.line);
                gainedThisMove += collapsed.gained;

                collapsed.mergedIndexes.forEach(cellIndex => {
                    merged.push(positionFor(direction, index, cellIndex));
                });
            }

            if (boardsMatch(before, board)) {
                boardElement.classList.remove('shake');
                void boardElement.offsetWidth;
                boardElement.classList.add('shake');
                return;
            }

            score += gainedThisMove;
            const spawned = addRandomTile();
            render(spawned ? [spawned] : [], merged);
            updateScores(gainedThisMove > 0);
            evaluateGame();
        }

        function tileClass(value) {
            return value <= 2048 ? `v${value}` : 'vlarge';
        }

        function hasPosition(list, row, col) {
            return list.some(position => position && position.row === row && position.col === col);
        }

        function render(spawned = [], merged = []) {
            tilesElement.innerHTML = '';

            for (let row = 0; row < SIZE; row++) {
                for (let col = 0; col < SIZE; col++) {
                    const value = board[row][col];
                    if (!value) continue;

                    const tile = document.createElement('div');
                    tile.className = `tile ${tileClass(value)}`;
                    tile.style.gridRow = String(row + 1);
                    tile.style.gridColumn = String(col + 1);
                    tile.textContent = String(value);
                    tile.setAttribute('aria-label', String(value));

                    if (hasPosition(spawned, row, col)) tile.classList.add('spawn');
                    if (hasPosition(merged, row, col)) tile.classList.add('merged');
                    tilesElement.appendChild(tile);
                }
            }
        }

        function updateScores(animate) {
            scoreElement.textContent = String(score);
            if (score > best) {
                best = score;
                saveBestScore();
            }
            bestElement.textContent = String(best);

            if (animate) {
                scoreElement.classList.remove('bump');
                void scoreElement.offsetWidth;
                scoreElement.classList.add('bump');
            }
        }

        function hasValue(value) {
            return board.some(row => row.includes(value));
        }

        function hasMovesLeft() {
            for (let row = 0; row < SIZE; row++) {
                for (let col = 0; col < SIZE; col++) {
                    const value = board[row][col];
                    if (value === 0) return true;
                    if (col < SIZE - 1 && value === board[row][col + 1]) return true;
                    if (row < SIZE - 1 && value === board[row + 1][col]) return true;
                }
            }
            return false;
        }

        function evaluateGame() {
            if (!won && hasValue(2048)) {
                won = true;
                showMessage('Você venceu!', true);
                announcement.textContent = 'Parabéns, você chegou ao bloco 2048!';
                return;
            }

            if (!hasMovesLeft()) {
                ended = true;
                showMessage('Fim de jogo!', false);
                announcement.textContent = 'Fim de jogo. Não há mais movimentos.';
            }
        }

        function showMessage(title, canContinue) {
            messageTitle.textContent = title;
            continueButton.hidden = !canContinue;
            messageElement.classList.remove('hidden');
        }

        function hideMessage() {
            messageElement.classList.add('hidden');
        }

        function continueGame() {
            keepPlaying = true;
            hideMessage();
            announcement.textContent = 'Continue jogando para aumentar sua pontuação.';
        }

        function directionFromKey(key) {
            const directions = {
                ArrowUp: 'up', w: 'up', W: 'up',
                ArrowDown: 'down', s: 'down', S: 'down',
                ArrowLeft: 'left', a: 'left', A: 'left',
                ArrowRight: 'right', d: 'right', D: 'right'
            };
            return directions[key];
        }

        document.addEventListener('keydown', event => {
            const direction = directionFromKey(event.key);
            if (!direction) return;
            event.preventDefault();
            move(direction);
        });

        boardElement.addEventListener('touchstart', event => {
            const touch = event.changedTouches[0];
            touchStart = { x: touch.clientX, y: touch.clientY };
        }, { passive: true });

        boardElement.addEventListener('touchend', event => {
            if (!touchStart) return;
            const touch = event.changedTouches[0];
            const dx = touch.clientX - touchStart.x;
            const dy = touch.clientY - touchStart.y;
            touchStart = null;

            if (Math.max(Math.abs(dx), Math.abs(dy)) < 28) return;
            move(Math.abs(dx) > Math.abs(dy)
                ? (dx > 0 ? 'right' : 'left')
                : (dy > 0 ? 'down' : 'up'));
        }, { passive: true });

        newGameButton.addEventListener('click', startGame);
        retryButton.addEventListener('click', startGame);
        continueButton.addEventListener('click', continueGame);
        boardElement.addEventListener('animationend', () => boardElement.classList.remove('shake'));

        bestElement.textContent = String(best);
        startGame();
    </script>
</body>
</html>
